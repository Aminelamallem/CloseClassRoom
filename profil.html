<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <title>Mon Profil - ClosedClassroom</title>
</head>

<body class="bg-gray-50 dark:bg-gray-900">
     <header>
        <nav class="bg-blue-400 w-full z-20 top-0 start-0 border-b border-default">
            <div class="max-w-screen-xl flex flex-col md:flex-row gap-3 items-center justify-between mx-auto p-4">
                <a href="index.html" class="flex items-center space-x-3 rtl:space-x-reverse">
                    <img src="logo_full_rounded.svg" class="h-9" alt="Flowbite Logo">
                    <span class="self-center text-xl text-heading font-semibold whitespace-nowrap">ClosedClassroom</span>
                </a>
                <div class="flex justify-between md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                    <a href="register.html">
                            <button button type="button" class="text-black bg-yellow-300 hover:bg-yellow-500 box-border border font-medium leading-5 rounded-full text-sm px-3 py-2">Connexion</button>
                    </a>
                    <button data-collapse-toggle="navbar-sticky" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base md:hidden hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary" aria-controls="navbar-sticky" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14"/></svg>
                    </button>
                </div>
                <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
                    <ul class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-default rounded-base bg-neutral-secondary-soft md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-neutral-primary">
                        <li>
                            <a href="accueil.html" class="block py-2 px-3 text-yellow-300 bg-brand rounded-sm md:bg-transparent md:text-fg-brand md:p-0" aria-current="page">Accueil</a>
                        </li>
                        <li>
                            <a href="cour.html" class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Cours</a>
                        </li>
                        <li>
                            <a href="inscription.html" class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <section class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
        <a href="#" class="flex items-center mb-6 text-2xl font-semibold text-gray-900 dark:text-white">
            <img class="w-8 h-8 mr-2" src="logo/logoClosed.svg" alt="logo">
            ClosedClassroom    
        </a>



   
    <div id="cours-container" class="grid grid-cols-12 gap-6"></div>

        <div class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
            <div class="p-6 space-y-4 md:space-y-6 sm:p-8 border-2 border-black rounded-lg">
                <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white text-center">
                    Mon Profil
                </h1>
                
                <form id="formProfil" class="space-y-4 md:space-y-6">
                    <div>
                        <label for="profileName" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nom</label>
                        <input type="text" id="profileName" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    </div>

                    <div>
                        <label for="profileFirstname" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Prénom</label>
                        <input type="text" id="profileFirstname" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    </div>

                    <div>
                        <label for="profileEmail" class="block mb-2 text-sm font-medium text-gray-400 dark:text-gray-500">Email (non modifiable)</label>
                        <input type="email" id="profileEmail" class="bg-gray-200 border border-gray-300 text-gray-500 text-sm rounded-lg block w-full p-2.5 cursor-not-allowed" readonly>
                    </div>

                    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 mt-6">
    <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700">
        Modifier le profil
    </button>

    <button type="button" id="btnSupprimer" class="w-full text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-red-500 dark:hover:bg-red-600">
        Supprimer mon compte
    </button>
</div>

<button type="button" id="btnDeconnexion" class="w-full mt-4 text-gray-500 hover:text-red-600 dark:text-gray-400 dark:hover:text-red-400 text-sm font-medium underline transition-colors">
    Se déconnecter de ClosedClassroom
</button>
                </form>
            </div>
        </div>
    </section>

     <footer class="bg-blue-400">
        <div class="w-full mx-auto max-w-screen-xl p-4 md:flex md:items-center md:justify-between">
        <span class="text-sm text-body sm:text-center">© 2023 <a href="https://flowbite.com/" class="hover:underline">ClosedClassroom</a><br>Tout droits réservés.
        </span>
        <ul class="flex flex-wrap items-center mt-3 text-sm font-medium text-body sm:mt-0">
            <li>
                <a href="#" class="hover:underline me-4 md:me-6">Politique de condidentialité</a>
            </li>
            <li>
                <a href="#" class="hover:underline me-4 md:me-6">Mentions légales</a>
            </li>
            <li>
                <a href="#" class="hover:underline me-4 md:me-6">Contact</a>
            </li>
            <li>
                <a href="#" class="hover:underline">CGU</a>
            </li>
        </ul>
        </div>
    </footer>
    <script type="module" src="dist/profile.js"></script>
</body>
</html>
